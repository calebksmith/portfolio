# The five gates, run on every push and pull request.
#
# They existed as npm scripts long before this file did, which meant they ran
# when someone remembered. A standard that depends on remembering is the exact
# failure the guardrails case study in this repository is about — so it would be
# a strange thing to leave unautomated here.
#
# One job, not five. These take seconds and share an install; parallel jobs would
# spend more time restoring node_modules than running the checks.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ordered cheapest-first, so an obvious failure reports in seconds rather
      # than after a full build.
      - name: Format
        run: npm run check:format

      - name: Contrast — every token pair, 3 themes × 2 modes
        run: npm run check:contrast

      - name: Copy conventions
        run: npm run check:copy

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # Separate job: it needs a production build and a real Chrome, and takes
  # minutes where the gates above take seconds. Failing fast on a type error
  # should not wait behind fifteen Lighthouse runs.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # `lhci autorun` starts the production server itself, measures five pages
      # three times each, and fails the job on a broken assertion. Accessibility,
      # best practices and SEO are errors below 100 — those are the claims this
      # site makes. Performance is a budget at 80 rather than a gate: the
      # homepage hero types its own text, and Lighthouse measures that as slow
      # paint. It is a trade that was measured and taken, not a regression.
      - name: Lighthouse
        run: npm run lighthouse

      # Scores go in the job summary whether or not anything failed. A number
      # nobody reads is a number nobody notices moving.
      - name: Report scores
        if: always()
        run: npm run lighthouse:summary
